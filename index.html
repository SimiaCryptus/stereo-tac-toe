<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stereo Games</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="topbar">
        <a class="home-link" href="/" title="Home">&larr;</a>
        <strong class="title">Stereo Games</strong>

        <div class="menu">
          <button type="button" class="menu-btn" id="appearance-btn" aria-expanded="false">
            Appearance ▾
          </button>
          <div class="menu-panel" id="appearance-panel" hidden></div>
        </div>

        <div class="menu">
          <button type="button" class="menu-btn" id="game-btn" aria-expanded="false">Game ▾</button>
          <div class="menu-panel menu-panel--narrow" id="game-panel" hidden>
            <label class="knob">
              <span class="knob-label">Mode</span>
              <select id="mode"></select>
            </label>
            <p class="blurb" id="blurb"></p>
            <div id="game-settings"></div>
          </div>
        </div>

        <label class="chk">
          <input type="checkbox" id="diagnostics" />
          Depth
        </label>
        <button id="reset">New Game</button>
        <span class="hint"><kbd>D</kbd> depth · <kbd>R</kbd> restart</span>
        <span id="status" class="status"></span>
      </div>

      <canvas id="game"></canvas>
    </main>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
