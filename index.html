        <div class="menu">
          <button type="button" class="menu-btn" id="appearance-btn" aria-expanded="false">

          <div class="menu-panel" id="appearance-panel" hidden></div>

        <span class="hint"><kbd>D</kbd> depth · <kbd>R</kbd> restart</span>
